
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page Title -->
    <title>To-Do List</title>

    <!-- CSS -->
    <link rel="stylesheet" href="index.css">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/301907f500.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="container">

        <!-- ================= HEADER ================= -->
        <header class="header">
            <h1>
                TO-DO LIST
                <i class="fa-regular fa-circle-check" style="color: #f75d02;"></i>
            </h1>
        </header>

        <hr>

        <!-- ================= ADD TASK ================= -->
        <section class="task-input-section">

            <div id="newtask">

                <div class="input-wrapper">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Type your todo..."
                        autocomplete="off"
                    >

                    <i class="fa-solid fa-list-check"></i>
                </div>

                <button id="push" type="button">
                    Add
                </button>

            </div>

        </section>

        <hr>

        <!-- ================= TASK LIST ================= -->
        <section class="tasks-section">

            <h2>My Tasks</h2>

            <div id="tasks">
                <!-- Tasks will be added dynamically using JavaScript -->
            </div>

        </section>

        <hr>

        <!-- ================= FOOTER ================= -->
        <footer id="footer">

            <div class="task-count">
                <span id="taskLeft">0</span>
                <span>tasks left</span>
            </div>

        </footer>

    </main>

    <!-- JavaScript -->
    <script src="index.js"></script>

</body>

</html>
